<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대전의 맛 - 찐맛집 아카이브</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind 커스텀 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        scaleUp: { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
                        bounceIn: { '0%': { transform: 'scale(0.8)', opacity: '0' }, '70%': { transform: 'scale(1.1)' }, '100%': { transform: 'scale(1)', opacity: '1' } },
                        fadeInUp: { '0%': { transform: 'translate(-50%, 20px)', opacity: '0' }, '100%': { transform: 'translate(-50%, 0)', opacity: '1' } }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.2s ease-out',
                        'scale-up': 'scaleUp 0.3s ease-out',
                        'bounce-in': 'bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                        'fade-in-up': 'fadeInUp 0.3s ease-out'
                    }
                }
            }
        }
    </script>
    
    <!-- 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="bg-stone-50 text-slate-800">
    <div id="root"></div>

    <!-- 모든 스크립트 로드 및 실행 -->
    <script>
        // GitHub Pages base path 감지
        const pathParts = window.location.pathname.split('/').filter(part => part);
        const lastPart = pathParts[pathParts.length - 1];
        if (lastPart === 'index.html' || lastPart === 'index') {
            pathParts.pop();
        }
        const BASE_PATH = pathParts.length > 0 ? '/' + pathParts.join('/') : '';
        
        async function loadScript(url) {
            const fullUrl = BASE_PATH ? `${BASE_PATH}/${url}` : url;
            const response = await fetch(fullUrl);
            if (!response.ok) {
                throw new Error(`Failed to load ${fullUrl}: ${response.status} ${response.statusText}`);
            }
            const code = await response.text();
            const compiled = Babel.transform(code, { presets: ['react'] }).code;
            eval(compiled);
        }

        async function initializeApp() {
            try {
                // 데이터 로드
                const dataUrl = BASE_PATH ? `${BASE_PATH}/assets/data/restaurants.json` : 'assets/data/restaurants.json';
                const dataResponse = await fetch(dataUrl);
                if (!dataResponse.ok) {
                    throw new Error(`Failed to load data: ${dataResponse.status} ${dataResponse.statusText}`);
                }
                window.RESTAURANT_DATA = await dataResponse.json();

                // 유틸리티 로드
                await loadScript('src/utils/mapLinks.js');
                await loadScript('src/utils/clipboard.js');

                // 아이콘 로드
                await loadScript('src/icons.jsx');

                // 컴포넌트 로드
                await loadScript('src/components/RestaurantCard.jsx');
                await loadScript('src/components/DetailModal.jsx');
                await loadScript('src/components/RandomModal.jsx');

                // 메인 App 로드
                await loadScript('src/app.jsx');

                // App 렌더링
                if (window.App) {
                    const root = ReactDOM.createRoot(document.getElementById('root'));
                    root.render(React.createElement(window.App));
                } else {
                    throw new Error('App 컴포넌트를 찾을 수 없습니다.');
                }
            } catch (error) {
                console.error('초기화 실패:', error);
                document.getElementById('root').innerHTML = `
                    <div style="padding: 40px; text-align: center; font-family: 'Pretendard', sans-serif;">
                        <h1 style="color: #dc2626; margin-bottom: 20px;">로드 오류가 발생했습니다</h1>
                        <p style="color: #64748b; margin-bottom: 10px;"><strong>오류:</strong> ${error.message}</p>
                        <p style="color: #64748b; margin-bottom: 10px;"><strong>BASE_PATH:</strong> ${BASE_PATH || '(없음)'}</p>
                        <p style="color: #64748b; margin-bottom: 10px;"><strong>현재 URL:</strong> ${window.location.href}</p>
                        <p style="color: #64748b; margin-top: 30px; font-size: 14px;">브라우저 콘솔을 확인하세요 (F12)</p>
                    </div>
                `;
            }
        }

        // DOM 로드 후 초기화
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
    </script>
</body>
</html>
