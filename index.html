<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대전의 맛 - 찐맛집 아카이브</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind 커스텀 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        scaleUp: { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
                        bounceIn: { '0%': { transform: 'scale(0.8)', opacity: '0' }, '70%': { transform: 'scale(1.1)' }, '100%': { transform: 'scale(1)', opacity: '1' } },
                        fadeInUp: { '0%': { transform: 'translate(-50%, 20px)', opacity: '0' }, '100%': { transform: 'translate(-50%, 0)', opacity: '1' } }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.2s ease-out',
                        'scale-up': 'scaleUp 0.3s ease-out',
                        'bounce-in': 'bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                        'fade-in-up': 'fadeInUp 0.3s ease-out'
                    }
                }
            }
        }
    </script>
    
    <!-- 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-stone-50 text-slate-800">
    <div id="root"></div>

    <!-- 모든 스크립트 로드 및 실행 -->
    <script>
        async function loadScript(url) {
            const response = await fetch(url);
            const code = await response.text();
            const compiled = Babel.transform(code, { presets: ['react'] }).code;
            eval(compiled);
        }

        async function initializeApp() {
            try {
                // 데이터 로드
                const dataResponse = await fetch('assets/data/restaurants.json');
                window.RESTAURANT_DATA = await dataResponse.json();

                // 유틸리티 로드
                await loadScript('src/utils/mapLinks.js');
                await loadScript('src/utils/clipboard.js');

                // 아이콘 로드
                await loadScript('src/icons.jsx');

                // 컴포넌트 로드
                await loadScript('src/components/RestaurantCard.jsx');
                await loadScript('src/components/DetailModal.jsx');
                await loadScript('src/components/RandomModal.jsx');

                // 메인 App 로드
                await loadScript('src/app.jsx');

                // App 렌더링
                if (window.App) {
                    const root = ReactDOM.createRoot(document.getElementById('root'));
                    root.render(React.createElement(window.App));
                } else {
                    console.error('App 컴포넌트를 찾을 수 없습니다.');
                }
            } catch (error) {
                console.error('초기화 실패:', error);
            }
        }

        // DOM 로드 후 초기화
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
    </script>
</body>
</html>
